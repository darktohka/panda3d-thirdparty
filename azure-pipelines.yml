variables:
  REPO_NAME: 'panda3d-thirdparty'

jobs:
- job: Windows
  pool:
    vmImage: 'windows-2022'

  strategy:
    matrix:
      vc143-x86-release:
        ARCHITECTURE_SUFFIX: ''
        BUILD_TOOLSET_VERSION: '143'
        BUILD_CONFIGURATION: 'release'
        CMAKE_GENERATOR: 'Visual Studio 17 2022'
        CMAKE_ARCHITECTURE: 'Win32'
      vc143-x64-release:
        ARCHITECTURE_SUFFIX: '-x64'
        BUILD_TOOLSET_VERSION: '143'
        BUILD_CONFIGURATION: 'release'
        CMAKE_GENERATOR: 'Visual Studio 17 2022'
        CMAKE_ARCHITECTURE: 'Win64'

  steps:
  # configure & generate
  - task: CMake@1
    inputs:
      cmakeArgs: .. -G "$(CMAKE_GENERATOR)" -A "$(CMAKE_ARCHITECTURE)" -Wno-dev -T "v$(BUILD_TOOLSET_VERSION),host=x64"

  # build
  - task: CMake@1
    inputs:
      cmakeArgs: --build . --config release -j4

  # tests
  #- task

  # install
  - task: CopyFiles@2
    inputs:
      sourceFolder: '$(Build.SourcesDirectory)/win-libs-vc17$(ARCHITECTURE_SUFFIX)'
      targetFolder: '$(Build.BinariesDirectory)/thirdparty/win-libs-vc17$(ARCHITECTURE_SUFFIX)'

  # packaging
  - task: ArchiveFiles@2
    inputs:
      rootFolderOrFile: '$(Build.BinariesDirectory)/thirdparty'
      archiveType: '7z'
      archiveFile: '$(Build.ArtifactStagingDirectory)/thirdparty.7z'

  # publish
  - task: PublishBuildArtifacts@1
    inputs:
      artifactName: '$(REPO_NAME)-vc$(BUILD_TOOLSET_VERSION)$(ARCHITECTURE_SUFFIX)-$(BUILD_CONFIGURATION)'
